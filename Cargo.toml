[package]
name = "financeindia"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A high-performance, lightweight Python library written in Rust for fetching Indian financial market data (NSE)."
license = "MIT"
homepage = "https://github.com/sandeep-jaiswar/financeindia"
repository = "https://github.com/sandeep-jaiswar/financeindia"

[lib]
name = "financeindia"
# rlib is required so `cargo test` can link the unit tests against libpython.
crate-type = ["cdylib", "rlib"]

[features]
# Enabled by maturin (see pyproject.toml) when building the wheel. Turns off
# libpython linking so the `.so` can be dlopen'd by the interpreter. `cargo
# test` / `cargo build` run WITHOUT this feature and link against libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
# Default features are omitted so tests link against libpython. the
# `extension-module` feature (coupled with `abi3-py38` for the wheel) is only
# enabled by maturin, keeping `cargo test` working.
pyo3 = { version = "0.24", features = ["abi3-py38"] }
# Ensure cookies feature is enabled
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "gzip", "stream"] }
chrono = "0.4"
zip = "2.2"
percent-encoding = "2.3"
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.1"
bytes = "1.0"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "sync", "time", "macros"] }
pyo3-async-runtimes = { version = "0.24", features = ["tokio-runtime"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
log = "0.4"
url = "2.5"
thiserror = "2.0"
