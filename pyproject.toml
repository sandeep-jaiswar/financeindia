[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "financeindia"
description = "A high-performance, lightweight Python library written in Rust for fetching Indian financial market data (NSE)."
authors = [
    { name = "sandeep jaiswar" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.8"
keywords = ["finance", "nse", "india", "trading", "stock-market", "xbrl", "async", "rust", "quantitative-trading", "algorithmic-trading", "financial-data", "market-data", "equity", "derivatives", "options", "futures", "websocket", "real-time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/sandeep-jaiswar/financeindia"
Repository = "https://github.com/sandeep-jaiswar/financeindia"
Issues = "https://github.com/sandeep-jaiswar/financeindia/issues"

[project.optional-dependencies]
mcx = ["curl_cffi"]
polars = ["polars"]

[tool.maturin]
features = ["extension-module"]
module-name = "financeindia.financeindia"
python-packages = ["financeindia"]
